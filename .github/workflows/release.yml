name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.2.0)"
        required: true

permissions:
  contents: write
  actions: write   # needed to trigger build.yml via gh workflow run

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump versions
        id: bump
        run: |
          set -e
          VERSION="${{ inputs.version }}"

          # Run again for a version bumped already — its build failed, say: no
          # second bump, the tag moves to main as it is now and the build reruns.
          if grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            CURRENT=$(jq -r .version package.json)
            if [ "$CURRENT" != "$VERSION" ]; then
              echo "::error::CHANGELOG.md has [$VERSION] but package.json is at $CURRENT."
              exit 1
            fi
            echo "v$VERSION is bumped already: rebuilding it from main."
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # package.json
          jq --arg v "$VERSION" '.version = $v' package.json > _tmp && mv _tmp package.json

          # tauri.conf.json
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > _tmp && mv _tmp src-tauri/tauri.conf.json

          # Cargo.toml — first occurrence only (the [package] block)
          sed -i "0,/^version = \".*\"/{s/^version = \".*\"/version = \"$VERSION\"/}" src-tauri/Cargo.toml

      - name: Bump changelog
        if: steps.bump.outputs.rebuild != 'true'
        run: node scripts/changelog.js bump "${{ inputs.version }}"

      - name: Commit & tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="v${{ inputs.version }}"

          # A published release keeps its tag: it is the code people installed.
          # (A draft left by a failed build is not found by tag: it may move.)
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "::error::$TAG is published already: release a new version instead."
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.bump.outputs.rebuild }}" != "true" ]; then
            git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml CHANGELOG.md
            git commit -m "chore: release $TAG"
            git push origin HEAD
          fi
          # On the commit to build; a tag left by a failed build moves along.
          git tag -f "$TAG"
          git push --force origin "$TAG"

      - name: Trigger build
        # GITHUB_TOKEN cannot trigger workflows via git push (GitHub anti-loop policy),
        # so we call build.yml explicitly on the tag we just created.
        run: gh workflow run build.yml --ref "v${{ inputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
