name: Build

on:
  workflow_dispatch:
    # Normally triggered by release.yml after the version bump and tag push.
    # Can also be run manually for ad-hoc builds (version will match whatever is in the repo).

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  release-notes:
    runs-on: ubuntu-22.04
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          NOTES=$(node scripts/changelog.js extract "$VERSION" 2>/dev/null || echo "")
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  create-release:
    # The release is created once, here, instead of by each matrix job: three
    # parallel jobs all calling tauri-action with `tagName` race to create the
    # same release, and the losers fail with `already_exists`. Listing releases
    # (rather than fetching by tag) also finds drafts, so re-running the workflow
    # on a tag that already has one reuses it instead of failing.
    needs: [check, release-notes]
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.ensure.outputs.result }}
    steps:
      - uses: actions/github-script@v7
        id: ensure
        with:
          result-encoding: string
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });
            const existing = releases.find((release) => release.tag_name === tag);
            if (existing) {
              core.info(`Reusing release ${existing.id} for ${tag}`);
              return String(existing.id);
            }
            const { data } = await github.rest.repos.createRelease({
              owner, repo,
              tag_name: tag,
              name: `ZuGit ${tag}`,
              body: process.env.RELEASE_BODY || '',
              draft: true,      // published by publish-release once every build uploaded
              prerelease: false,
            });
            core.info(`Created release ${data.id} for ${tag}`);
            return String(data.id);
        env:
          RELEASE_BODY: ${{ needs.release-notes.outputs.body }}

  build:
    needs: [check, release-notes, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish-release:
    # Undrafts the release only after every platform uploaded, so users never see
    # a release that is missing the build for their OS.
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.repos.updateRelease({
              owner, repo,
              release_id: Number('${{ needs.create-release.outputs.release_id }}'),
              draft: false,
            });
